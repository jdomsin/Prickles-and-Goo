<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prickles &amp; Goo — Comments View Lab</title>
<style>
    :root{
        --paper:#FFF1E5; --surface:#fff; --surface-2:#FBEFE3; --ink:#1D1B19; --ink-soft:#6B6259;
        --hairline:#E6D7C9; --serif:Georgia,"Times New Roman",serif;
        --gooey:#0D7680; --gooey-soft:#E3EFEF; --prickly:#990F3D; --prickly-soft:#F6E4E9;
    }
    [data-theme="dark"]{
        --paper:#16130F; --surface:#211C16; --surface-2:#2A241D; --ink:#F3E9DD; --ink-soft:#B3A595; --hairline:#3A322A;
        --gooey:#5FB6BE; --gooey-soft:#1E2E2E; --prickly:#E0698E; --prickly-soft:#33202A;
    }
    *{box-sizing:border-box;}
    body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:28px clamp(16px,4vw,40px) 90px;}
    h1{font-family:var(--serif); font-size:1.8rem; margin:0 0 4px;}
    p.lead{color:var(--ink-soft); margin:0 0 18px; line-height:1.5; max-width:680px;}
    .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:22px;}
    .lbl{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-right:4px;}
    .chip{font:inherit; font-size:.86rem; cursor:pointer; border:1px solid var(--hairline); background:var(--surface); color:var(--ink); border-radius:999px; padding:7px 14px;}
    .chip.active{border-color:var(--ink); background:var(--ink); color:var(--paper);}
    .note{font-size:.82rem; color:var(--ink-soft); margin:-8px 0 22px; max-width:680px; line-height:1.5;}
    .list{max-width:620px; margin:0 auto;}

    /* shared row */
    .row{border-top:1px solid var(--hairline); padding:16px 2px;}
    .row .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:7px;}
    .row .nm{font-family:var(--serif); font-size:1.15rem;}
    .row .pct{font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
    .row .barline{height:7px; border-radius:99px; overflow:hidden; display:flex; background:var(--surface-2);}
    .row .barline .g{background:var(--gooey);} .row .barline .p{background:var(--prickly);}

    /* reason chips */
    .reason{display:flex; gap:9px; align-items:flex-start; font-size:.9rem; line-height:1.35; padding:7px 11px; border-radius:11px; margin-top:7px; border:1px solid var(--hairline); background:var(--surface);}
    .reason .up{font-size:.74rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-soft); white-space:nowrap; padding-top:1px;}
    .reason.g{border-left:3px solid var(--gooey);} .reason.p{border-left:3px solid var(--prickly);}
    .subhead{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:13px 0 2px;}
    .subhead.g{color:var(--gooey);} .subhead.p{color:var(--prickly);}

    /* A · expand */
    .toggle{margin-top:9px; font:inherit; font-size:.82rem; cursor:pointer; background:none; border:0; color:var(--ink-soft); padding:4px 0; display:inline-flex; gap:6px; align-items:center;}
    .toggle:hover{color:var(--ink);}
    .panel{display:none;} .panel.open{display:block;}
    .toptease{font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:.9rem; margin-top:9px; padding-left:11px; border-left:2px solid var(--hairline);}

    /* B · split */
    .split{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
    .split .col .subhead{margin-top:0;}
    @media(max-width:520px){ .split{grid-template-columns:1fr;} }

    /* C · drawer */
    .countbtn{margin-top:9px; font:inherit; font-size:.82rem; cursor:pointer; border:1px solid var(--hairline); background:var(--surface); color:var(--ink); border-radius:999px; padding:5px 13px;}
    .scrim{position:fixed; inset:0; background:rgba(20,14,10,.34); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:min(520px,100%); max-height:82vh; overflow:auto;
        background:var(--surface); border:1px solid var(--hairline); border-bottom:0; border-radius:22px 22px 0 0;
        box-shadow:0 -16px 50px rgba(20,14,10,.22); padding:20px clamp(18px,5vw,26px) 30px; z-index:41; transition:transform .32s cubic-bezier(.2,.8,.2,1);}
    .sheet.show{transform:translate(-50%,0);}
    .sheet h2{font-family:var(--serif); font-size:1.4rem; margin:6px 0 2px;}
    .sheet .sub{color:var(--ink-soft); font-size:.85rem; margin:0 0 6px;}
    .grip{width:38px; height:4px; border-radius:99px; background:var(--hairline); margin:0 auto 14px;}
</style>
</head>
<body>
    <h1>Comments View Lab</h1>
    <p class="lead">Three ways to surface the qualitative comments on the results page. Same mock data each time — pick the one that reads best and I'll wire it into the live results.</p>
    <div class="bar">
        <span class="lbl">View</span>
        <button class="chip active" data-v="expand">A · Expand in place</button>
        <button class="chip" data-v="split">B · Gooey vs prickly</button>
        <button class="chip" data-v="drawer">C · Comments drawer</button>
        <span class="lbl" style="margin-left:14px">Theme</span>
        <button class="chip" data-t="light">Light</button>
        <button class="chip" data-t="dark">Dark</button>
    </div>
    <p class="note" id="note"></p>

    <div class="list" id="list"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>

<script>
    // mock ranked items with reasons per verdict (text, upvotes), sorted by votes
    const ITEMS = [
        { name:"Figma", gp:78, total:41,
          gooey:[["Delightful to actually use",12],["Real-time collab feels like magic",8],["Thoughtful craft in every detail",5],["The plugin community is great",2]],
          prickly:[["Bogs down on huge files",4],["Pricey once you add seats",2]] },
        { name:"Palantir", gp:24, total:33,
          gooey:[["Genuinely hard engineering",4]],
          prickly:[["The surveillance vibe is off",9],["Too secretive about what it does",7],["Government contracts feel icky",3]] },
        { name:"Apple", gp:61, total:58,
          gooey:[["Hardware still feels premium",10],["It just works, mostly",6]],
          prickly:[["Walled-garden everything",6],["You pay the Apple tax",5]] }
    ];
    const NOTES = {
        expand: "A · Each row stays compact with its top quote; tap “N comments” to expand the full gooey/prickly breakdown in place. Best for skimming, detail on demand.",
        split:  "B · Always shows the single strongest gooey reason and strongest prickly reason side by side — the “why people disagree” view. Densest at a glance, but only the top of each side.",
        drawer: "C · A small count button opens a bottom sheet with every comment, grouped and scrollable. Best when items rack up lots of comments."
    };
    const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const reasonHTML = (r,cls) => '<div class="reason '+cls+'"><span class="up">▲ '+r[1]+'</span><span>'+esc(r[0])+'</span></div>';
    const count = it => it.gooey.length + it.prickly.length;

    let view = "expand";
    const listEl = document.getElementById('list');
    const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');

    function rowShell(it){
        return '<div class="top"><span class="nm">'+it.name+'</span><span class="pct">'+it.gp+'% gooey · '+it.total+' votes</span></div>'+
               '<div class="barline"><span class="g" style="width:'+it.gp+'%"></span><span class="p" style="width:'+(100-it.gp)+'%"></span></div>';
    }
    function groupedHTML(it){
        let h='';
        if(it.gooey.length){ h+='<div class="subhead g">Gooey — why</div>'+it.gooey.map(r=>reasonHTML(r,'g')).join(''); }
        if(it.prickly.length){ h+='<div class="subhead p">Prickly — why</div>'+it.prickly.map(r=>reasonHTML(r,'p')).join(''); }
        return h;
    }

    function render(){
        document.getElementById('note').textContent = NOTES[view];
        listEl.innerHTML='';
        ITEMS.forEach(it=>{
            const row=document.createElement('div'); row.className='row';
            if(view==="expand"){
                const top = it.gp>=50 ? (it.gooey[0]||it.prickly[0]) : (it.prickly[0]||it.gooey[0]);
                row.innerHTML = rowShell(it)+
                    '<div class="toptease">“'+esc(top[0])+'”</div>'+
                    '<button class="toggle">▸ '+count(it)+' comments</button>'+
                    '<div class="panel">'+groupedHTML(it)+'</div>';
                const tg=row.querySelector('.toggle'), pn=row.querySelector('.panel');
                tg.onclick=()=>{ const open=pn.classList.toggle('open'); tg.textContent=(open?'▾ ':'▸ ')+count(it)+' comments'; };
            } else if(view==="split"){
                const g=it.gooey[0], p=it.prickly[0];
                row.innerHTML = rowShell(it)+'<div class="split">'+
                    '<div class="col">'+(g?'<div class="subhead g">Top gooey</div>'+reasonHTML(g,'g'):'')+'</div>'+
                    '<div class="col">'+(p?'<div class="subhead p">Top prickly</div>'+reasonHTML(p,'p'):'')+'</div>'+
                    '</div>';
            } else {
                row.innerHTML = rowShell(it)+'<button class="countbtn">💬 '+count(it)+' comments</button>';
                row.querySelector('.countbtn').onclick=()=>openSheet(it);
            }
            listEl.appendChild(row);
        });
    }
    function openSheet(it){
        sheet.innerHTML='<div class="grip"></div><h2>'+it.name+'</h2><p class="sub">'+it.gp+'% gooey · '+it.total+' votes · '+count(it)+' comments</p>'+groupedHTML(it);
        scrim.classList.add('show'); requestAnimationFrame(()=>sheet.classList.add('show'));
    }
    function closeSheet(){ sheet.classList.remove('show'); scrim.classList.remove('show'); }
    scrim.onclick=closeSheet;

    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ view=b.dataset.v;
        document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(); });
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ document.documentElement.setAttribute('data-theme', b.dataset.t==='dark'?'dark':''); });

    render();
</script>
</body>
</html>
