<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prickles &amp; Goo — Glow &amp; Shards</title>
<style>
    @property --p { syntax:'<number>'; initial-value:0; inherits:true; }
    @property --goo { syntax:'<number>'; initial-value:0; inherits:true; }
    @property --prk { syntax:'<number>'; initial-value:0; inherits:true; }

    :root {
        --paper:#FFF1E5; --surface:#FFFFFF; --surface-2:#FBEFE3;
        --ink:#1D1B19; --ink-soft:#6B6259; --hairline:#E6D7C9;
        --gooey:#15A8A8; --gooey-2:#0a5d65; --gooey-lt:#7FE3DA;
        --prickly:#C01048; --prickly-2:#73092c; --prickly-lt:#FF6F91;
        --shadow:0 1px 2px rgba(40,30,20,.05), 0 10px 30px rgba(40,30,20,.10);
        --shadow-lift:0 22px 60px rgba(40,30,20,.22);
        --serif:"Iowan Old Style","Palatino Linotype","Georgia",serif;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,Helvetica,Arial,sans-serif;
        --gain:1;
    }
    [data-theme="dark"] {
        --paper:#141110; --surface:#221D1A; --surface-2:#2C2622;
        --ink:#F3EBE2; --ink-soft:#A89C90; --hairline:#3A322C;
        --gooey:#2DD4C4; --gooey-2:#0e6a6a; --gooey-lt:#A9F4EC;
        --prickly:#FF4D7D; --prickly-2:#9c1840; --prickly-lt:#FF9DB6;
        --shadow-lift:0 26px 70px rgba(0,0,0,.7);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; overflow:hidden; }
    body { font-family:var(--sans); background:var(--paper); color:var(--ink); transition:background .45s,color .45s; -webkit-font-smoothing:antialiased; }

    header {
        position:fixed; top:0; left:0; right:0; z-index:40;
        display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:14px clamp(14px,4vw,28px);
        background:color-mix(in srgb,var(--paper) 78%,transparent); backdrop-filter:saturate(140%) blur(14px);
        border-bottom:1px solid var(--hairline);
    }
    .brand { font-family:var(--serif); font-weight:700; font-size:1.05rem; }
    .brand .amp { color:var(--prickly); }
    .ctrl { display:flex; align-items:center; gap:10px; }
    .segmented { display:inline-flex; background:var(--surface-2); border:1px solid var(--hairline); border-radius:999px; padding:4px; }
    .segmented button { font:600 .8rem var(--sans); border:0; background:transparent; color:var(--ink-soft); padding:7px 14px; border-radius:999px; cursor:pointer; transition:.2s; }
    .segmented button.active { color:var(--ink); background:var(--surface); box-shadow:var(--shadow); }
    .theme-toggle { width:36px; height:36px; border-radius:999px; border:1px solid var(--hairline); background:var(--surface); color:var(--ink); cursor:pointer; display:grid; place-items:center; flex:0 0 auto; }

    /* ---------------- EDGES ---------------- */
    .edge {
        position:fixed; top:0; bottom:0; width:50vw; max-width:520px; pointer-events:none; overflow:hidden; z-index:5;
        transition:--p .18s cubic-bezier(.2,.7,.2,1);
        -webkit-mask-image:linear-gradient(var(--mask-dir), #000 28%, transparent 96%);
                mask-image:linear-gradient(var(--mask-dir), #000 28%, transparent 96%);
    }
    .edge.right { right:0; --mask-dir:to left; }
    .edge.left  { left:0;  --mask-dir:to right; }
    .fx { position:absolute; inset:0; }

    /* ===== GOOEY GLOW (right) ===== */
    .glow-ambient {
        position:absolute; right:-12%; top:50%; transform:translateY(-50%);
        width:130%; height:150%;
        background:radial-gradient(closest-side, color-mix(in srgb,var(--gooey) 85%, transparent), transparent 72%);
        filter:blur(34px); opacity:calc(var(--p) * .5 * var(--gain));
    }
    .glow-core {
        position:absolute; right:0; top:0; bottom:0; width:62%;
        background:radial-gradient(120% 78% at 100% 50%, color-mix(in srgb,var(--gooey-lt) 90%, transparent), color-mix(in srgb,var(--gooey) 60%, transparent) 38%, transparent 64%);
        filter:blur(12px); opacity:calc(var(--p) * .8 * var(--gain));
    }
    .edge-rim {
        position:absolute; right:0; top:0; bottom:0; width:6px;
        background:linear-gradient(180deg, transparent, var(--gooey-lt), var(--gooey), transparent);
        filter:blur(2px); opacity:var(--p);
    }
    .bubble { position:absolute; transform:translateY(calc(var(--p) * var(--rise))) translateX(calc(var(--p) * -8px)); will-change:transform; }
    .bubble .ball {
        display:block; width:var(--s); height:var(--s); border-radius:50%;
        background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), rgba(255,255,255,.25) 26%, var(--gooey) 58%, var(--gooey-2) 100%);
        box-shadow: 0 0 calc(var(--s) * .55) color-mix(in srgb,var(--gooey) 65%, transparent), inset 0 calc(var(--s) * -.12) calc(var(--s) * .18) rgba(0,0,0,.18);
        animation: floatwob var(--dur) ease-in-out infinite; animation-delay:var(--ad);
    }
    .bubble { opacity: clamp(0, (var(--p) - var(--d)) / .35, 1); filter: blur(calc((1 - var(--depth)) * 3px)); }
    @keyframes floatwob { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-7px,-9px); } }

    /* ===== PRICKLY SHARDS (left) ===== */
    .prk-ambient {
        position:absolute; left:-12%; top:50%; transform:translateY(-50%);
        width:128%; height:135%;
        background:radial-gradient(closest-side, color-mix(in srgb,var(--prickly) 60%, transparent), transparent 72%);
        filter:blur(30px); opacity:calc(var(--p) * .34 * var(--gain));
    }
    .shard {
        position:absolute; left:0; top:var(--y); height:var(--h);
        width: calc(clamp(0, (var(--p) - var(--d)) / .4, 1) * var(--len));
        transform: rotate(var(--a)); transform-origin:left center;
        background:linear-gradient(100deg, color-mix(in srgb,var(--prickly) 92%, transparent), color-mix(in srgb,var(--prickly-2) 72%, transparent) 70%, color-mix(in srgb,var(--prickly-2) 40%, transparent));
        clip-path:polygon(0 0, 100% 16%, 100% 84%, 0 100%);
        filter:drop-shadow(0 0 7px color-mix(in srgb,var(--prickly) 45%, transparent));
        opacity: clamp(0, (var(--p) - var(--d)) / .3, 1);
    }
    .shard::before { /* specular edge */
        content:""; position:absolute; inset:0; clip-path:inherit;
        background:linear-gradient(177deg, color-mix(in srgb,var(--prickly-lt) 95%, transparent), transparent 26%);
    }
    .shard.back { filter:drop-shadow(0 0 5px color-mix(in srgb,var(--prickly) 30%, transparent)) blur(1.4px); }

    /* big quiet word cue */
    .word { position:fixed; top:50%; transform:translateY(-50%) scale(.9); z-index:6; pointer-events:none; font-family:var(--serif); font-weight:700; letter-spacing:.02em; text-transform:uppercase; font-size:clamp(2.6rem,10vw,6rem); line-height:1; }
    .word.goo { right:4%; color:var(--gooey); opacity:calc(var(--goo) * .14); transform:translateY(-50%) scale(calc(.9 + var(--goo)*.12)); }
    .word.prk { left:4%; color:var(--prickly); opacity:calc(var(--prk) * .14); transform:translateY(-50%) scale(calc(.9 + var(--prk)*.12)); }

    /* ---------------- STAGE ---------------- */
    main { position:fixed; inset:0; display:grid; place-items:center; z-index:10; }
    .stack { text-align:center; }
    .swipe-card {
        position:relative; overflow:hidden;
        width:min(360px,80vw); min-height:300px; background:var(--surface); border:1px solid var(--hairline);
        border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
        touch-action:none; cursor:grab; will-change:transform; user-select:none;
        box-shadow: var(--shadow-lift),
            0 0 calc(var(--goo) * 70px) color-mix(in srgb,var(--gooey) 60%, transparent),
            0 0 calc(var(--prk) * 70px) color-mix(in srgb,var(--prickly) 60%, transparent);
    }
    .swipe-card:active { cursor:grabbing; }
    .swipe-card::before, .swipe-card::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; }
    .swipe-card::before { background:linear-gradient(270deg, color-mix(in srgb,var(--gooey) 50%, transparent), transparent 56%); opacity:var(--goo); }
    .swipe-card::after  { background:linear-gradient(90deg,  color-mix(in srgb,var(--prickly) 50%, transparent), transparent 56%); opacity:var(--prk); }
    .swipe-card .name { font-family:var(--serif); font-size:2.1rem; letter-spacing:-.01em; z-index:1; }
    .swipe-card .meta { font-size:.8rem; color:var(--ink-soft); z-index:1; }

    .buttons { display:flex; gap:12px; justify-content:center; margin-top:26px; }
    .btn { font:600 .92rem var(--sans); border:0; border-radius:999px; padding:13px 26px; cursor:pointer; color:#fff; transition:transform .15s; }
    .btn:active { transform:scale(.96); }
    .btn-prk { background:var(--prickly); } .btn-goo { background:var(--gooey); }
    .hint { margin-top:20px; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); opacity:.65; }

    /* ---- Mobile: small screens have no side gutters, so lift the effect
       layer ABOVE the card and shrink the card. The incoming glow / shards
       then spill over the card's leading edge as it moves, instead of being
       hidden behind it. Desktop keeps effects behind the card. ---- */
    @media (max-width:768px) {
        .edge { z-index:20; width:62vw; }
        .word { z-index:19; font-size:clamp(2rem,13vw,4rem); }
        .swipe-card { width:min(300px,66vw); min-height:228px; }
        .swipe-card .name { font-size:1.7rem; }
        .buttons { margin-top:20px; }
        /* pull the densest art inward so it reads in the tight space */
        .edge { -webkit-mask-image:linear-gradient(var(--mask-dir), #000 8%, transparent 98%);
                        mask-image:linear-gradient(var(--mask-dir), #000 8%, transparent 98%); }
    }
</style>
</head>
<body>
    <header>
        <div class="brand">Prickles <span class="amp">&amp;</span> Goo · Glow &amp; Shards</div>
        <div class="ctrl">
            <div class="segmented" id="intensity">
                <button data-gain="0.62">Subtle</button>
                <button data-gain="1" class="active">Lush</button>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </header>

    <div class="edge left"  id="edgeL"><div class="fx" id="fxL"></div></div>
    <div class="edge right" id="edgeR"><div class="fx" id="fxR"></div></div>
    <div class="word prk">Prickly</div>
    <div class="word goo">Gooey</div>

    <main>
        <div class="stack">
            <div class="swipe-card" id="card">
                <span class="name" id="cardName">Apple</span>
                <span class="meta">drag toward a side, or use the buttons</span>
            </div>
            <div class="buttons">
                <button class="btn btn-prk" id="btnPrk">Prickly</button>
                <button class="btn btn-goo" id="btnGoo">Gooey</button>
            </div>
            <p class="hint">← Prickly &nbsp;·&nbsp; Gooey →</p>
        </div>
    </main>

<script>
    const SAMPLES = ["Apple","Tesla","Netflix","Amazon","Nvidia","Elon Musk","Microsoft","Google","Abraham Lincoln","Z"];
    let sampleIdx = 0;

    const edgeL = document.getElementById('edgeL'), edgeR = document.getElementById('edgeR');
    const fxL = document.getElementById('fxL'), fxR = document.getElementById('fxR');
    const card = document.getElementById('card'), cardName = document.getElementById('cardName');
    const root = document.documentElement;
    const rnd = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---- build glassy bubbles (right) + faceted shards (left) ---- */
    function build() {
        // GOOEY: glow layers + bubbles
        let R = '<div class="glow-ambient"></div><div class="glow-core"></div><div class="edge-rim"></div>';
        for (let i = 0; i < 16; i++) {
            const s = rnd(9, 46), depth = rnd(.25, 1);
            const right = rnd(6, 240), bottom = rnd(-30, 70);
            R += `<div class="bubble" style="right:${right}px; bottom:${bottom}px;` +
                 `--s:${s}px; --depth:${depth.toFixed(2)}; --rise:${rnd(-180,-440)}px;` +
                 `--d:${rnd(0,.5).toFixed(2)}; --dur:${rnd(3.2,6).toFixed(1)}s; --ad:${rnd(0,3).toFixed(1)}s;">` +
                 `<span class="ball"></span></div>`;
        }
        fxR.innerHTML = R;

        // PRICKLY: ambient + layered shards (some 'back' for depth)
        let L = '<div class="prk-ambient"></div>';
        for (let i = 0; i < 12; i++) {
            const back = Math.random() < .4;
            L += `<div class="shard${back ? ' back' : ''}" style="` +
                 `--y:${(i * 8 + rnd(0,4)).toFixed(1)}%; --h:${back ? rnd(14,26) : rnd(26,50)}px;` +
                 `--len:${back ? rnd(110,200) : rnd(180,340)}px; --a:${rnd(-7,7).toFixed(1)}deg;` +
                 `--d:${rnd(0,.45).toFixed(2)};"></div>`;
        }
        fxL.innerHTML = L;
    }

    function setSide(side, p) {
        if (side === 'goo') { edgeR.style.setProperty('--p', p); edgeL.style.setProperty('--p', 0); }
        else if (side === 'prk') { edgeL.style.setProperty('--p', p); edgeR.style.setProperty('--p', 0); }
        else { edgeL.style.setProperty('--p', 0); edgeR.style.setProperty('--p', 0); }
        root.style.setProperty('--goo', side === 'goo' ? p : 0);
        root.style.setProperty('--prk', side === 'prk' ? p : 0);
    }

    /* ---- swipe physics ---- */
    const THRESH = 155, COMMIT = 112;
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, busy = false, raf = 0;

    function frame() {
        raf = 0;
        card.style.transform = `translate(${dx}px, ${dy * .22}px) rotate(${dx / 28}deg)`;
        const p = clamp(Math.abs(dx) / THRESH, 0, 1);
        setSide(dx > 0 ? 'goo' : dx < 0 ? 'prk' : 'none', p);
    }
    const schedule = () => { if (!raf) raf = requestAnimationFrame(frame); };

    function down(e) { if (busy) return; dragging = true; const t = e.touches ? e.touches[0] : e; startX = t.clientX; startY = t.clientY; card.style.transition = 'none'; }
    function move(e) { if (!dragging) return; const t = e.touches ? e.touches[0] : e; dx = t.clientX - startX; dy = t.clientY - startY; schedule(); }
    function up() {
        if (!dragging) return; dragging = false;
        if (Math.abs(dx) > COMMIT) commit(dx > 0 ? 'goo' : 'prk');
        else reset();
    }
    function reset() {
        card.style.transition = 'transform .42s cubic-bezier(.2,.85,.25,1)';
        card.style.transform = 'translate(0,0) rotate(0)';
        dx = dy = 0; setSide('none', 0);
    }
    function commit(side) {
        busy = true;
        setSide(side, 1); // bloom to full
        card.style.transition = 'transform .46s cubic-bezier(.4,0,.2,1)';
        const off = side === 'goo' ? innerWidth + 200 : -(innerWidth + 200);
        card.style.transform = `translate(${off}px,-46px) rotate(${off / 26}deg)`;
        setTimeout(() => {
            setSide('none', 0);
            sampleIdx = (sampleIdx + 1) % SAMPLES.length;
            cardName.textContent = SAMPLES[sampleIdx];
            card.style.transition = 'none';
            card.style.transform = 'translate(0,0)';
            dx = dy = 0; busy = false;
        }, 480);
    }

    card.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    card.addEventListener('touchstart', down, { passive: true });
    card.addEventListener('touchmove', move, { passive: true });
    card.addEventListener('touchend', up);
    document.getElementById('btnGoo').onclick = () => { if (!busy) commit('goo'); };
    document.getElementById('btnPrk').onclick = () => { if (!busy) commit('prk'); };

    /* ---- controls ---- */
    document.getElementById('intensity').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        document.querySelectorAll('#intensity button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        root.style.setProperty('--gain', b.dataset.gain);
    });
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.onclick = () => {
        const dark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
        themeBtn.textContent = dark ? '🌙' : '☀️';
    };

    build();
    setSide('none', 0);
</script>
</body>
</html>
